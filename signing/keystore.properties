# Release signing key for Distraction Killer Launcher.
#
# Key and password are committed on purpose. This is a personal, sideloaded
# app: Android only installs an update over an existing install when both are
# signed with the same key, so keeping the key in the repo means any clone can
# build an installable update. The password guards nothing that the committed
# key itself does not already expose. Rotate it (see README.md here) if this
# repository ever becomes public.
storeFile=signing/distraction-killer.jks
storePassword=distraction-killer-launcher
keyAlias=distraction-killer
keyPassword=distraction-killer-launcher
